name: CI

on:
  push:
    # main is covered by release.yml, which calls this workflow. Without this the
    # same checks would run twice on every push to main.
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - name: ruff format
        run: uv run ruff format --check --diff .
      - name: ruff lint
        run: uv run ruff check --output-format=github .
      - name: mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python, and the version the image ships.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: coverage
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: birdframe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot it and check /healthz
        run: |
          # Webhook-only mode: no BIRDNET_URL, so the poller stays off and the
          # healthcheck reflects the app alone.
          docker run -d --name birdframe -p 8080:8080 birdframe:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null 2>&1; then
              echo "up after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | tee /dev/stderr | grep -q '"ok": *true'
          # The page must render.
          curl -fsS http://127.0.0.1:8080/ > /dev/null
          # The switch goes first: the driver only composes while art mode is on,
          # so enabling it before the bird lands means the webhook's wake finds
          # it awake and hangs the plate straight away.
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"enabled":true}' http://127.0.0.1:8080/api/tv | grep -q '"enabled": *true'
          # A bird through the same door BirdNET-Go uses. The demo seeder that
          # stood in here is gone: its birds entered the gallery indistinguishable
          # from real ones.
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"scientific_name":"Cardinalis cardinalis","confidence":0.94}' \
            http://127.0.0.1:8080/webhook | grep -q '"ok": *true'
          # The driver composes on its own thread and fetches the plate on the
          # way, so wait for it to report the cardinal (plate 159) as hanging.
          # Do not skip ahead to /preview.jpg: that answers with a bare mat when
          # nothing is composed yet, so fetching it early passes the JPEG check
          # below without ever decoding a plate.
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/tv | grep -q '"plate": *159'; then
              echo "composed after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/tv | tee /dev/stderr | grep -q '"plate": *159'
          # Pillow's wheels are the kind of dependency that installs fine and
          # then cannot decode anything, so this renders a real plate rather
          # than just importing.
          curl -fsS -o /tmp/preview.jpg http://127.0.0.1:8080/preview.jpg
          file /tmp/preview.jpg | grep -q JPEG
      - name: Container logs
        if: always()
        run: docker logs birdframe || true
      - name: Clean up
        if: always()
        run: docker rm -f birdframe || true
