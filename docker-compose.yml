# BirdFrame - Audubon plates on the wall, driven by BirdNET-Go.
#
# In Portainer: Stacks -> Add stack -> paste this (or point it at your git repo),
# set BIRDNET_URL below to your BirdNET-Go address, then Deploy.

services:
  birdframe:
    build: .
    # Or, if you push it to a registry, drop `build` and use:
    # image: your-registry/birdframe:latest
    container_name: birdframe
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Plate images and the detection history are cached here. Survives
      # rebuilds, so each plate is only ever downloaded once and a restart puts
      # the previous gallery straight back on the wall.
      - birdframe-cache:/cache
    environment:
      # Poll BirdNET-Go for ALL detections. Strongly recommended: BirdNET-Go's
      # webhook fires only for *new* species by default, so webhook-only mode
      # gives you a nearly static picture. Leave blank to disable polling.
      BIRDNET_URL: "http://birdnet-go:8080"
      POLL_SECONDS: "60"

      # Ignore detections the model isn't confident about.
      MIN_CONFIDENCE: "0.65"

      # How many detections stay in the rotation.
      HISTORY_SIZE: "40"

      # Optional shared secret for POST /webhook and POST /api/demo. Unset means
      # both are open, which is fine on a trusted LAN and not otherwise.
      # WEBHOOK_TOKEN: "change-me"

      LOG_LEVEL: "INFO"
      TZ: "America/Los_Angeles"

    # Small: one gunicorn worker, and the plate cache is on the volume, not in
    # memory. Raise if you have a very large HISTORY_SIZE.
    deploy:
      resources:
        limits:
          memory: 256M

    security_opt:
      - no-new-privileges:true

    # If BirdNET-Go runs in another compose stack, join its network so
    # `http://birdnet-go:8080` resolves. Otherwise use the host IP above.
    # networks:
    #   - birdnet

volumes:
  birdframe-cache:

