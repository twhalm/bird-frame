[project]
name = "birdframe"
# Placeholder, never bumped. Releases are identified by git tag alone and nothing
# commits a version back here; the running version comes from BIRDFRAME_VERSION
# and is reported by /healthz. tests/test_version.py holds this to 0.0.0.
version = "0.0.0"
description = "Audubon plates in a Samsung Frame's Art Mode, driven by BirdNET-Go detections"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Troy Halm" }]
keywords = ["birdnet", "audubon", "digital-frame", "birding"]
classifiers = [
  "Private :: Do Not Upload",
  "Framework :: Flask",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "flask>=3.1.3,<4",
  "requests>=2.34.2,<3",
  "gunicorn>=26.0.0,<27",
  # The mat, the bevel and the two-up pairing are drawn here now that Art Mode
  # takes a flat image rather than a web page. See compose.py.
  "pillow>=11.3.0,<13",
  # NickWaterton's fork, not the `samsungtvws` on PyPI: the fork is the one that
  # keeps up with the Frame's art channel across the 2021-2024 model changes,
  # which is exactly the part we depend on. Pinned to a commit because the fork
  # does not cut releases, and an unpinned master is a silent upgrade of the one
  # dependency that can take the wall down.
  "samsungtvws @ git+https://github.com/NickWaterton/samsung-tv-ws-api.git@fe95ef1d784cd32f49bf9a07ec479576574eea07",
]

[project.scripts]
birdframe = "birdframe.__main__:main"

[project.urls]
Homepage = "https://github.com/thalm/birdframe"

[dependency-groups]
# Dev tooling. Excluded from the image via `uv sync --no-dev`.
dev = [
  { include-group = "test" },
  "mypy>=2.3.0",
  "ruff>=0.16.0",
  "types-requests>=2.32.0",
]
test = ["pytest>=9.1.1", "pytest-cov>=7.0.0", "responses>=0.25.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ------------------------------------------------------------------------- uv

[tool.uv]
# Pin the index in the project rather than inheriting whatever is in the
# developer's ~/.config/uv/uv.toml. A corporate mirror there gets baked into
# uv.lock's URLs, and CI (which cannot resolve that host) then fails on a lock
# it did not create. Public PyPI keeps the lockfile portable.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/birdframe"]

[tool.hatch.metadata]
# samsungtvws is a pinned git reference, not a PyPI version. Stating it inline
# in project.dependencies rather than hiding it in tool.uv.sources is
# deliberate: PyPI carries a *different* maintainer's `samsungtvws`, and a bare
# name here would quietly resolve to the wrong library for anyone not using uv.
# This project is `Private :: Do Not Upload`, so PyPI's ban on direct
# references costs nothing.
allow-direct-references = true

# ---------------------------------------------------------------------- ruff

[tool.ruff]
line-length = 90
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "UP",          # pyupgrade
  "B",           # bugbear
  "C4",          # comprehensions
  "SIM",         # simplify
  "RUF",         # ruff-specific
  "ANN",         # annotations
  "S",           # bandit
  "PTH",         # prefer pathlib
  "RET",         # return style
  "TID",         # tidy imports
  "LOG", "G",    # logging correctness
]
ignore = [
  "ANN401",  # Any is the honest type for "whatever the webhook sent"
  "S101",    # assert is fine in tests
  "SIM105",  # contextlib.suppress is not clearer than try/except: pass here
  # Typographic apostrophes are deliberate: Audubon's plate names contain them
  # and normalise() exists precisely to fold them.
  "RUF001",
  "RUF002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S105", "S106", "PTH"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# The fork ships no stubs and no py.typed. tv.py confines it to one small
# wrapper class whose own surface is fully typed, so the Any stops there.
module = ["samsungtvws.*"]
ignore_missing_imports = true
# Its __init__ re-exports SamsungTVWS without an __all__, which strict mode
# reads as private. Nothing to fix on our side.
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["tests.*"]
# Test bodies are exercised by running them; annotating every fixture and every
# `def test_x(client)` is noise that finds no bugs.
disallow_untyped_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false

# --------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["birdframe"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
