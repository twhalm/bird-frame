<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BirdFrame</title>
<style>
/* ---------------------------------------------------------------------------
   BirdFrame.

   The TV is the frame, so there is no frame drawn here: the mat runs edge to
   edge and the only join is the bevel where the mat meets the print. No text.

   Most plates are portrait (0.82), about 40% are landscape (1.46-1.70). A
   landscape plate fills the opening alone; portraits hang two-up, which is
   what makes a 16:9 screen read as a deliberate pair rather than one tall
   picture stranded in the middle.
   --------------------------------------------------------------------------- */

:root {
  /* Conservation rag board. The whole screen is this colour.
     Warm and clearly darker than the plates' own paper - the plates carry a
     white margin of their own, and if the board is too pale the bevel
     disappears into it and the mat stops reading as a mat. */
  --mat:        #ded6c4;

  /* The four bevel faces. Solid rag board is the same colour all the way
     through, so these are the board colour under different amounts of light -
     no white core.

     Each face is a flat plane with a fixed normal, so each takes ONE flat tone;
     a gradient across a flat face is not how light works. The cut flares toward
     the viewer, which inverts the intuition: with light from the upper left the
     TOP face tilts away and darkens, while the BOTTOM face tilts up into the
     light and brightens.

     Values are Lambertian for light at azimuth -35 deg, elevation 40 deg, and
     are regenerated by the light-direction override in the script below. */
  --bevel-top:    #a09b8e;
  --bevel-left:   #ada799;
  --bevel-right:  #eae2cf;
  --bevel-bottom: #f7eeda;

  --mat-margin: 6.5vh;     /* board around the outside */
  --mat-gutter: 5.2vh;     /* board between two hung prints */
  --bevel:      0.68vh;    /* depth of the 45deg cut */
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  /* The mat itself. Because the background is the board colour, the slow
     anti-burn-in drift below never exposes an edge. */
  background: var(--mat);
  overflow: hidden;
  cursor: none;
}

.wall {
  height: 100%;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--mat-gutter);
  padding: var(--mat-margin);
  /* Nothing on a TV should sit on the same pixels all day. ~20 minutes, a few
     pixels, invisible in the room. */
  animation: drift 23min ease-in-out infinite alternate;
}
@keyframes drift {
  from { transform: translate(-6px, -4px); }
  to   { transform: translate(6px, 4px); }
}

/* One hung print. The bevel is a four-sided solid border: each side is one flat
   tone, and the browser mitres the corners at 45deg, which is exactly the joint
   a mat cutter leaves. */
.hung {
  height: 100%;
  flex: 0 0 auto;
  border-style: solid;
  border-width: var(--bevel);
  border-top-color:    var(--bevel-top);
  border-right-color:  var(--bevel-right);
  border-bottom-color: var(--bevel-bottom);
  border-left-color:   var(--bevel-left);
  opacity: 0;
  transition: opacity 2.6s ease-in-out;
}
.hung.shown { opacity: 1; }

/* The print. The board is flush against it - a window mat is cut to the same
   plane as the paper, so there is nothing to cast a shadow onto it. */
.hung img {
  display: block;
  height: 100%;
  width: 100%;
  object-fit: fill;   /* the opening is cut to the plate, so no distortion */
}

@media (prefers-reduced-motion: reduce) {
  .wall { animation: none; }
  .hung { transition: none; }
}

/* Portrait screens (phone): one print, tighter board. */
@media (max-aspect-ratio: 1/1) {
  :root { --mat-margin: 4vh; --mat-gutter: 3vh; }
}
</style>
</head>
<body>
<div class="wall" id="wall"></div>

<script>
(() => {
  "use strict";

  const params    = new URLSearchParams(location.search);
  const POLL_MS   = (+params.get("poll")   || 20) * 1000;
  const ROTATE_MS = (+params.get("rotate") || 150) * 1000;

  const wall = document.getElementById("wall");

  // A plate wider than this hangs alone; anything taller pairs up.
  const LANDSCAPE = 1.15;

  /**
   * Shade the four bevel faces for a given light direction.
   *
   * The cut flares toward the viewer, so each face's normal has a +z component
   * plus a lean in one direction: the top face points down, the bottom face
   * points up, and so on. Lambert (n.l) on those four normals, normalised
   * against the flat board surface so the board itself keeps its stated colour.
   *
   *   azimuth  - degrees, 0 = light from straight above, negative = from the
   *              left. -35 is the conventional gallery raking light.
   *   elevation- degrees above the wall plane.
   */
  function relight(azDeg, elDeg) {
    const base = [222, 214, 196];   // must track --mat
    const AMBIENT = 0.62;           // fill light; keeps shadowed faces from going flat black

    const az = azDeg * Math.PI / 180, el = elDeg * Math.PI / 180;
    const L = [
      Math.cos(el) * Math.sin(az),
      -Math.cos(el) * Math.cos(az),   // y grows downward in screen space
      Math.sin(el),
    ];

    const lambert = n => {
      const len = Math.hypot(...n);
      const d = (n[0] * L[0] + n[1] * L[1] + n[2] * L[2]) / len;
      return AMBIENT + (1 - AMBIENT) * Math.max(0, d);
    };

    const surface = lambert([0, 0, 1]);   // the board's own face, lit head-on
    const faces = {
      top:    [0,  1, 1],   // flares down toward the viewer
      bottom: [0, -1, 1],   // flares up
      left:   [1,  0, 1],   // flares right
      right:  [-1, 0, 1],   // flares left
    };

    for (const [name, n] of Object.entries(faces)) {
      const m = lambert(n) / surface;
      const hex = base
        .map(c => Math.min(255, Math.round(c * m)).toString(16).padStart(2, "0"))
        .join("");
      document.documentElement.style.setProperty(`--bevel-${name}`, `#${hex}`);
    }
  }

  // ?light=-35,40  (azimuth,elevation in degrees)
  const light = (params.get("light") || "").split(",").map(Number);
  if (light.length === 2 && light.every(Number.isFinite)) relight(light[0], light[1]);

  let queue  = [];      // detections that have a plate, newest first
  let ratios = {};      // plate number -> true aspect ratio, once measured
  let cursor = 0;
  let showingSig = null;
  let newestKey  = null;
  let rotateTimer = null;

  const keyOf = d => d ? `${d.scientific_name || d.common_name}@${d.detected_at}` : null;

  /** Load a plate and record its real aspect ratio. */
  function load(plate) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        ratios[plate] = img.naturalWidth / img.naturalHeight;
        resolve(img);
      };
      img.onerror = reject;
      img.src = `/plate/${plate}`;
    });
  }

  /**
   * Choose what hangs next, starting at `from`: a single landscape plate, or a
   * pair of portraits. Measures the images first, so the decision uses real
   * dimensions rather than a guess.
   */
  async function compose(from) {
    if (!queue.length) return null;

    const first = queue[from % queue.length];
    let img;
    try { img = await load(first.plate); } catch { return null; }

    if (ratios[first.plate] >= LANDSCAPE) {
      return [{ item: first, img }];
    }

    // Find the next portrait in the queue to hang alongside it.
    for (let step = 1; step < queue.length; step++) {
      const cand = queue[(from + step) % queue.length];
      if (cand.plate === first.plate) continue;
      try {
        const img2 = await load(cand.plate);
        if (ratios[cand.plate] < LANDSCAPE) {
          return [{ item: first, img }, { item: cand, img: img2 }];
        }
      } catch { /* try the next one */ }
    }

    // Only one portrait to show.
    return [{ item: first, img }];
  }

  function render(slots) {
    const sig = slots.map(s => s.item.plate).join("+");
    if (sig === showingSig) return;
    showingSig = sig;

    const next = slots.map(({ item, img }) => {
      const fig = document.createElement("figure");
      fig.className = "hung";
      // Cut the opening to the plate: the bevel follows the paper's own shape.
      fig.style.aspectRatio = String(ratios[item.plate] || 0.823);

      const el = document.createElement("img");
      el.src = img.src;
      el.alt = "";           // decorative: the page is the artwork
      fig.appendChild(el);
      return fig;
    });

    // Cross-fade: new prints fade up as the old ones fade out, then are removed.
    const old = Array.from(wall.children);
    next.forEach(n => wall.appendChild(n));
    requestAnimationFrame(() => {
      next.forEach(n => n.classList.add("shown"));
      old.forEach(o => o.classList.remove("shown"));
    });
    setTimeout(() => old.forEach(o => o.remove()), 2800);
  }

  async function showFrom(i) {
    const slots = await compose(i);
    if (slots && slots.length) render(slots);
    return slots ? slots.length : 0;
  }

  function scheduleRotation() {
    clearInterval(rotateTimer);
    rotateTimer = setInterval(async () => {
      if (queue.length < 2) return;
      const shown = await showFrom(cursor);
      cursor = (cursor + Math.max(shown, 1)) % queue.length;
    }, ROTATE_MS);
  }

  async function poll() {
    try {
      const r = await fetch("/api/current", { cache: "no-store" });
      if (!r.ok) return;
      const data = await r.json();
      queue = data.recent || [];
      if (!queue.length) return;

      const freshest = keyOf(queue[0]);
      if (freshest !== newestKey) {
        newestKey = freshest;
        cursor = 0;
        const shown = await showFrom(0);
        cursor = Math.max(shown, 1) % queue.length;
        scheduleRotation();
      }
    } catch (_) { /* server restarting; next tick will pick it up */ }
  }

  // 'd' seeds demo birds. ?token=... is forwarded, so the key still works when
  // WEBHOOK_TOKEN is set.
  addEventListener("keydown", e => {
    if (e.key !== "d") return;
    const token = params.get("token");
    const url = token ? `/api/demo?token=${encodeURIComponent(token)}` : "/api/demo";
    fetch(url, { method: "POST" }).then(poll).catch(() => {});
  });

  poll();
  setInterval(poll, POLL_MS);
  scheduleRotation();
})();
</script>
</body>
</html>
